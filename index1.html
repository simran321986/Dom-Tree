<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
</head>
<body>

        function changecContent() {
             document.getElementById("heading").innerHTML = "Hello JavaScript!"; 
             document.getElementById("message").innerHTML = "You have successfully changed the content!";
             }
    </script>   
</body>
